name: Security Audit

on:
  push:
    branches: ["security/**"]
  pull_request:
    branches: ["claude/manus-migration-independent-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan current tree for common secret formats
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          patterns = [
              ("telegram-token", re.compile(r"(?<![A-Za-z0-9_])\d{6,12}:[A-Za-z0-9_-]{20,}(?![A-Za-z0-9_])")),
              ("api-key", re.compile(r"(?<![A-Za-z0-9_])sk-(?:ant-)?[A-Za-z0-9_-]{20,}(?![A-Za-z0-9_])")),
              ("aws-access-key", re.compile(r"(?<![A-Z0-9])AKIA[0-9A-Z]{16}(?![A-Z0-9])")),
              ("private-key", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")),
          ]

          ignored_dirs = {".git", "node_modules", "dist", "coverage"}
          findings = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  for kind, pattern in patterns:
                      if pattern.search(line):
                          findings.append((str(path), line_no, kind))

          if findings:
              for path, line_no, kind in findings:
                  print(f"Potential secret: {path}:{line_no} [{kind}]")
              sys.exit(1)

          print("No matching secret formats found in the current tree.")
          PY
