name: Test & Build

on:
  push:
    branches: [main, development, claude/manus-migration-independent-*]
  pull_request:
    branches: [main, development]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: suppley_calc_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Para análise completa

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Run tests (if any)
        run: pnpm test --run 2>/dev/null || echo "No tests found"

      - name: Build
        run: pnpm build
        env:
          VITE_APP_ID: test-app
          VITE_OAUTH_PORTAL_URL: ""
          NODE_ENV: production
          DATABASE_URL: mysql://root:root@localhost:3306/suppley_calc_test
          JWT_SECRET: test-secret-key-for-ci
          ANTHROPIC_API_KEY: dummy-for-build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 5

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Build falhou. Verifique logs: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })
