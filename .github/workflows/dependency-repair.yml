name: Dependency Repair (one-time)

on:
  push:
    branches: ["security/codeql-fixes"]
    paths:
      - ".github/workflows/dependency-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:root@localhost:3306/suppley_calc_test
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      ANTHROPIC_API_KEY: dummy-for-ci

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: suppley_calc_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply audit fixes
        run: pnpm audit --fix

      - name: Re-sync lockfile
        run: pnpm install --lockfile-only

      - name: Prepare test database
        run: pnpm exec drizzle-kit push --force

      - name: Type check
        run: pnpm check

      - name: Run tests
        run: pnpm test --run

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_APP_ID: test-app
          VITE_OAUTH_PORTAL_URL: ""

      - name: Commit repaired dependency files
        shell: bash
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "No dependency file changes were generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "security: apply dependency audit fixes"
          git push origin HEAD:security/codeql-fixes
