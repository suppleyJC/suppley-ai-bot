    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/logo-suppley.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      /* Hide Manus watermark/badge - applied globally */
      [class*="manus" i], [id*="manus" i],
      [class*="watermark" i], [id*="watermark" i],
      [class*="made-with" i], [id*="made-with" i],
      div[style*="Made with"], span[style*="Made with"],
      a[href*="manus.im"], a[href*="manus.app"],
      .manus-badge, .manus-watermark, #manus-badge, #manus-watermark,
      [data-manus], [data-watermark],
      div:has(> span:contains("Made with")),
      div:has(> a[href*="manus"]) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
        overflow: hidden !important;
        position: absolute !important;
        left: -9999px !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
