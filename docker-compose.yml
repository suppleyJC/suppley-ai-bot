version: '3.9'

services:
  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suppley-ai-bot
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: mysql://${DB_USER:-suppley}:${DB_PASSWORD:-changeme}@db:3306/${DB_NAME:-suppley_calc}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      PORT: 3000
      # Optional OAuth configuration
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      VITE_APP_ID: ${VITE_APP_ID:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - suppley-network
    volumes:
      # Optional: mount logs directory
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: suppley-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-suppley_calc}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootchangeme}
      MYSQL_USER: ${DB_USER:-suppley}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      # Only expose for development, remove in production behind firewall
      - "3306:3306"
    volumes:
      # Persist database data
      - db-data:/var/lib/mysql
      # Optional: custom MySQL configuration
      # - ./mysql.cnf:/etc/mysql/conf.d/custom.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootchangeme}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - suppley-network
    # Security: limit resources
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Optional: phpMyAdmin for database management (development only)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: suppley-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-rootchangeme}
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - suppley-network
    profiles:
      - debug

volumes:
  # Database persistence volume
  db-data:
    driver: local

networks:
  suppley-network:
    driver: bridge
