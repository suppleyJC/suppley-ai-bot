version: '3.8'

services:
  mysql:
    image: mysql:8.0-alpine
    container_name: suppley_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: suppley_calc
      MYSQL_USER: suppley
      MYSQL_PASSWORD: ${DB_PASSWORD:-SuppleyDb2024}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suppley_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suppley_app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://suppley:${DB_PASSWORD:-SuppleyDb2024}@mysql:3306/suppley_calc
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VITE_APP_ID: ${VITE_APP_ID}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - suppley_net

volumes:
  mysql_data:
    driver: local

networks:
  suppley_net:
    driver: bridge
