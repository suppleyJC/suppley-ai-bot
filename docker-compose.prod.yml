version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: suppley_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: suppley_calc
      MYSQL_USER: suppley
      MYSQL_PASSWORD: ${DB_PASSWORD:-SuppleyDb2024}
    ports:
      # O app conecta via rede interna do Docker (mysql:3306), não precisa
      # publicar no host. Mapeado só no localhost numa porta alternativa para
      # debug, evitando conflito com um MySQL nativo na 3306 do host.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suppley_net

  app:
    # Usa exatamente a imagem que o scripts/deploy.sh builda (docker build -t
    # suppley-app:latest). Sem isto, o compose criava/reusava uma imagem própria
    # (suppley-ai-bot_app), podendo subir um build antigo em cache.
    image: suppley-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suppley_app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://suppley:${DB_PASSWORD:-SuppleyDb2024}@mysql:3306/suppley_calc
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VITE_APP_ID: ${VITE_APP_ID}
      # AWS S3 — armazenamento de arquivos (uploads de PDF/imagem)
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - suppley_net

volumes:
  # Usa o volume EXISTENTE com os dados reais de produção (criado por um compose
  # antigo, projeto "suppley"). Sem isto, o compose criava um volume novo e vazio
  # (suppley-ai-bot_mysql_data), e o app subia sem os dados/migrations.
  mysql_data:
    external: true
    name: suppley_mysql_data

networks:
  suppley_net:
    driver: bridge
